services:
  app:
    build: .
    restart: unless-stopped
    # Подхватывает переменные из .env. Явный `environment` ниже перекрывает совпадающие ключи
    # (например DATABASE_URL должен указывать на сервис db, а не localhost).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/qadocs?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qadocs
    ports:
      - "5432:5432"
    volumes:
      - qadocs_pg:/var/lib/postgresql/data

volumes:
  qadocs_pg:

